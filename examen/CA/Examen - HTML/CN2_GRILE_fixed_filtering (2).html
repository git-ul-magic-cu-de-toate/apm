var RIGHTS={0:{question:"Accesul la o stivă exploatează:",rights:["Localitatea spațială"],wrongs:["Niciuna","Localitatea temporală","Nu se poate determina","Ambele localități"],feedback:"Stivele sunt ținute contiguu în memorie și sunt accesate, în general, secvențial. Asta înseamnă că, dacă am accesat o adresă din stivă, este probabil să vrem să accesăm și adresele următoare sau precedente."},1:{question:"Avem un sistem de calcul cu două niveluri de cache (L1 și L2). Dacă înlăturăm nivelul L2 de cache, cum se va modifica L1 hit time?",rights:["Nu se modifică"],wrongs:["Crește","Depinde de L2 hit time","Scade","Nu se poate calcula"],feedback:"L1 hit time este timpul de acces la o adresă ce este deja in L1 cache, deci nu este influențat de L2 cache."},2:{question:"Avem un sistem de calcul cu un singur nivel de cache (L1). Dacă adăugam un al doilea nivel de cache (L2), cum se vor modifica următorii\nparametri de funcționare: L1 hit time, L1 miss rate, L1 miss penalty?",rights:["L1 hit time neschimbat, L1 miss rate neschimbat, L1 miss penalty scade"],wrongs:["L1 hit time scade, L1 miss rate crește, L1 miss penalty scade","L1 hit time crește, L1 miss rate scade, L1 miss penalty scade","L1 hit time neschimbat, L1 miss rate neschimbat, L1 miss penalty crește","L1 hit time scade, L1 miss rate neschimbat, L1 miss penalty scade"],feedback:"Viteza de acces în primul nivel de cache rămâne neschimbată, deci L1 hit time rămâne neschimbat. Dimensiunea și funcționarea primului nivel de cache rămân neschimbate, deci miss rate rămâne neschimbat. Cum accesul la al doilea nivel de cache este mai rapid decât accesul la RAM, miss penalty scade."},3:{question:"Bill dorește să construiască un cip de memorie de 128K x 32, dar are doar cipuri de 32K x 16. De câte cipuri are nevoie Bill?",rights:["8"],wrongs:["64","16","128","32"],feedback:"(128K / 32K) * (32 / 16) = 8"},4:{question:"Bill dorește să construiască un cip de memorie de 128K x 32, dar are doar cipuri de 8K x 16. De câte cipuri are nevoie Bill?",rights:["32"],wrongs:["128","256","64","16"],feedback:"(128K / 8K) * (32 / 16) = 32"},5:{question:"Bill dorește să construiască un cip de memorie de 1M x 64, dar are doar cipuri de 128K x 32. De câte cipuri are nevoie Bill?",rights:["16"],wrongs:["32","8","64","128"],feedback:"(1M / 128K) * (64 / 32) = 16"},6:{question:"Bill dorește să construiască un cip de memorie de 256K x 32, dar are doar cipuri de 32K x 8. De câte cipuri are nevoie Bill?",rights:["32"],wrongs:["64","16","8","128"],feedback:"(256K / 32K) * (32 / 8) = 32"},7:{question:"Bill dorește să construiască un cip de memorie de 256K x 64, dar are doar cipuri de 16K x 8. De câte cipuri are nevoie Bill?",rights:["128"],wrongs:["8","16","32","64"],feedback:"(256K / 16K) * (64 / 8) = 128"},8:{question:"Bill dorește să construiască un cip de memorie de 512K x 64, dar are doar cipuri de 16K x 8. De câte cipuri are nevoie Bill?",rights:["256"],wrongs:["16","128","64","8"],feedback:"(512K / 16K) * (64 / 8) = 256"},9:{question:"Care dintre următoarele afirmații este adevărată?",rights:["Instrucțiunea RETI activează întreruperile la nivel global"],wrongs:["Instrucțiunea SEI dezactivează întreruperile la nivel global","Instrucțiunea CLI activează întreruperile la nivel global","Instrucțiunea CALL_ISR activează întreruperile la nivel global"],feedback:""},10:{question:"Care dintre următoarele este adevărată?",rights:["Un cache set-asociativ cu o singură linie per set este un cache mapat direct"],wrongs:["Un cache set-asociativ cu un singur set este un cache mapat direct","Un cache set-asociativ cu o singură linie per set este un cache complet-asociativ","Un cache set-asociativ cu două seturi este un cache complet-asociativ","Toate variantele sunt adevărate"],feedback:"Între seturi maparea se face în mod direct. Dacă seturile au o singură linie, înseamnă ca avem mapare directă între toate liniile, deci este un cache mapat direct."},11:{question:"Care dintre următoarele este un motiv valid pentru folosirea adreselor virtuale?",rights:["Este mai dificil ca un program ce funcționează prost să afecteze alte programe concurente"],wrongs:["Permite upgrade-ul gratuit de la Windows 7 la Windows 10","Permite unui proces să acceseze întreg spațiul de memorie","Mărește rata de transfer a dispozitivelor I/O","Permite lucrul mai facil cu stiva"],feedback:"Memoria virtuală permite separarea spațiilor de adresă între programe (procese)."},12:{question:"Care dintre următoarele instrucțiuni modifică Stack Pointer?",rights:["RCALL"],wrongs:["BRBC","RJMP","BRBS"],feedback:""},13:{question:"Care dintre următoarele rămâne neschimbat la translatarea unei adrese virtuale într-o adresă fizică?",rights:["Page offset"],wrongs:["Toate variantele","Cache tag","Page number","TLB tag"],feedback:"Offset-ul în cadrul paginii rămâne același, chiar dacă adresa virtuală a paginii este diferită față de adresa fizică."},14:{question:"Care funcție de mapare cache are cele mai puține șanse să producă thrashing (adică oferă șanse minime ca două blocuri să concureze la\nstocarea în aceeași linie)?",rights:["Complet-asociativă"],wrongs:["Set-asociativă","Directă","Nu se poate determina","Toate trei"],feedback:"Cum orice linie de memorie poate intra în orice linie de cache, un cache complet-asociativ oferă cea mai bună șansă de a evita thrashing."},15:{question:"Ce dimensiune are registrul general R16 al procesorului implementat de noi?",rights:["8 biți"],wrongs:["4 octeți","32 biți","16 biți"],feedback:""},16:{question:"Ce registru ar trebui modificat pentru a configura un pin ca ieșire?",rights:["DDRA"],wrongs:["OCRA","PINA","PINA"],feedback:""},17:{question:"Ce registru are rolul de contor?",rights:["TCNT0"],wrongs:["TIMSK","TCCR0A","OCR0A"],feedback:""},18:{question:"Ce valoare are SP după execuția codului de mai jos, știind că valoarea sa inițială este 204?\n<img src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIUAAAD6BAMAAAB9gJkbAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAVUExURejy9Q8oLDxTV9Pf4o+go iciuna","Localitatea temporală","Localitatea spațială"],feedback:"Decrementarea presupune scrieri succesive la aceeași adresă. Asta înseamnă că, dacă am accesat o adresă, este probabil că vom dori să o accesăm din nou în curând. De aici localizarea temporală. Accesarea memorie printr-un pointer pe care îl decrementăm rezultă într-un acces secvențial. Asta înseamnă că, dacă am accesat o adresă, este probabil că vom dori să accesăm și adresele precedente. De aici localizarea spațială. Deci sunt ambele tipuri de localizare!"},23:{question:"Folosind întregul set de instrucțiuni AVR, scrieți o secvență de cod care:\n- Configurează portul A al unui microcontroller ATtiny20 ca pini de ieșire\n- Setează valoarea pinilor PA4, PA5 și PA6 să fie 0 (Low)\n- Setează valoarea celorlalți pini să fie 1 (High)\nConsiderăm:\nPINA equ 0x00\nDDRA equ 0x01\nPORTA equ 0x02",rights:["ldi R16, 0b11111111 out DDRA, R16 ldi R16, 0b10001111 out PORTA, R16"],wrongs:["ldi R16, 0b00000000 out DDRA, R16 ldi R16, 0b01110000 out PORTA, R16","ldi R16, 0b10001111 out DDRA, R16 ldi R16, 0b10001111 out PORTA, R16","ldi R16, 0b01110000 out DDRA, R16 ldi R16, 0b01110000 out PORTA, R16"],feedback:""},24:{question:"Incrementarea unei variabile exploatează:",rights:["Localitatea temporală"],wrongs:["Localitatea spațială","Ambele localități","Nu se poate determina","Niciuna"],feedback:"Incrementarea unei variabile presupune scrieri repetate la aceeași adresă. Deci, dacă am accesat acea adresă este probabil că vom dori să o accesăm din nou în curând."},25:{question:"Instructiunea SBI 7, 2:",rights:["Setează pe 1 bitul 2 la adresa 7."],wrongs:["Setează pe 1 bitul 7 la adresa 2.","Setează pe 0 bitul 7 la adresa 2.","Setează pe 0 bitul 2 la adresa 7.","Stochează la adresa 2 valoarea 7.","Stochează la adresa 7 valoarea 2."],feedback:""},26:{question:"Magistrala de comunicație SPI:",rights:["Este o magistrală sincronă de transfer a datelor"],wrongs:["Are o topologie multi-master, multi-slave","Are o schemă de adre  memorie și una mapată într-un periferic pot fi accesate simultan de către un procesor.",rights:["Fals"],wrongs:["Adevărat"],feedback:"Perifericele și memoria sunt mapate în același spațiu de adresă, deci nu pot fi accesate simultan."},38:{question:"O magistrala de comunicație serială:",rights:["Necesita un control mai complex decât o magistrală paralelă"],wrongs:["Poate transfera date doar asincron","Permite doar comunicarea punct la punct","Are limitări puternice de lățime de bandă","Necesită în general un număr mare de linii de comunicație"],feedback:"Un protocol de comunicare serial necesită un control mai complex pentru, spre exemplu, determinarea biților transmiși și a numărului acestora"},39:{question:"O memorie cache cu linii de 32 octeți lungime este organizată în 32 de seturi a câte 32 linii. Dacă adresarea se face la nivel de octet, cu\nadrese pe 32 de biți, care este dimensiunea în biți a tag-ului pentru fiecare linie de cache?",rights:["22"],wrongs:["19","17","18","21","20"],feedback:"32 - log2(32 * 32) = 22"},40:{question:"O memorie cache cu linii de 8 octeți lungime este organizată în 128 de seturi a câte 4 linii. Dacă adresarea se face la nivel de octet, cu adrese\npe 32 de biți, care este dimensiunea în biți a tag-ului pentru fiecare linie de cache?",rights:["22"],wrongs:["21","23","20","19"],feedback:"32 - log2(128 * 8) = 22"},41:{question:"Parcurgerea unei liste înlănțuite alocate contiguu în memorie exploatează:",rights:["Localitatea spațială"],wrongs:["Niciuna","Localitatea temporală","Nu se poate determina","Ambele localități"],feedback:"Lista este alocată contiguu în memorie, iar parcurgere rezultă în acces secvențial. Asta înseamnă că, dacă am accesat o adresă din listă, este probabil să vrem să accesăm și adresele următoare sau precedente."},42:{question:"Parcurgerea unui vector exploatează:",rights:["Localitatea spațială"],wrongs:["Localitatea temporală","Niciuna","Nu se poate determina","Ambele localități"],feedback:"Vectorii sunt ținuți contiguu în memorie iar parcugerea unui vector rezultă în acces secvențial. Asta înseamnă că, dacă am accesat o adresă din vector, este probabil să vrem să accesăm și adresele următoare sau precedente."},43:{question:"Pentru a maximiza performanța, TLB-urile sunt organizate de obicei sub forma unor cache-uri mapate direct.",rights:["Fals"],wrongs:["Adevărat"],feedback:"TLB-urile sunt de obicei organizate sub forma unor cache-uri set-asociative sau complet-asociative."},44:{question:"Presupuneți că acum 20 de ani ați scris un cod pentru o arhitectura x86 care petrecea jumătate din timp cu accese la memorie și cealaltă\njumătate făcând calcule. Dacă am rula același cod astăzi pe o arhitectură x86-compatible, cel mai probabil el ar:",rights:["Petrece mai mult timp cu accesul memoriei"],wrongs:["Menține aceeași proporție 50-50% a timpilor de rulare","Petrece mai mult timp făcând calcule","Exporta calculele in Cloud","Nu se poate determina"],feedback:"Viteza procesoarelor a crescut mai mult decât viteza memoriilor."},45:{question:"Problema cu un cache ce folosește o politică Write-Back este:",rights:["Nu menține consistența datelor din memoriile unui sistem multi-procesor"],wrongs:["Riscă să ocupe toată lățimea de bandă a magistralei procesor-memorie","Nicio opțiune","Scade performanța unui cache","Necesită un TLB separat pentru a asigura transferul de date"],feedback:"Cum datele modificate în cache nu sunt modificate imediat și în RAM, într-un sistem multi-procesor trebuie sa implementăm un protocol de coerență a datelor dacă folosim un cache Write-Back."},46:{question:"Problema cu un cache ce folosește o politică Write-Through este:",rights:["Scade performanța cache-ului"],wrongs:["Nu poate fi folosită în sisteme multi-procesor, chiar dacă CPU-urile fac snooping pentru un update","Nici o variantă","Necesită un overhead suplimentar în cache pentru a contabiliza blocurile care au fost modificate","Riscă să lase memoria principală invalidă pentru o perioada lungă de timp"],feedback:"Faptul că la fiecare scriere cache-ul trebuie să facă o scriere și în RAM înseamnă că nu poate fi la fel de rapid ca un cache care nu trebuie să facă asta."},47:{question:"Procesorul poate să citească din RAM în timp ce RAM-ul este reîmprospătat.",rights:["Fals"],wrongs:["Adevărat"],feedback:"RAM-ul este inaccesibil în timpul unui refresh."},49:{question:"Translatarea adreselor din memoria virtuală este utilă chiar și atunci când dimensiunea totală a memoriei virtuale este mai mică decât\ndimensiunea memoriei fizice",rights:["Adevărat"],wrongs:["Fals"],feedback:"Memoria virtuală este utilă chiar și atunci când spațiul de adresă virtual este mai mic decât spațiul de adresă fizic, spre exemplu, pentru separația spațiului de adresă între procese."},50:{question:"Un TLB:",rights:["Ajută la reducerea timpului de acces la o locație din memoria principală"],wrongs:["Nicio opțiune","Are un număr limitat de acționări pe ciclu de memorie","Nu poate fi folosit în sisteme multi-procesor, pentru că produce inconsistențe la accesul memoriei partajate","Poate fi folosit fără probleme și pentru accesul la locații de I/O"],feedback:"TLB-ul ne ajută să facem mai repede translatarea dintr-o adresă virtuală într-o adresă fizică, deci face accesul la memoria principală mai rapid."},51:{question:"Un cache mapat direct este organizat intern pe 16384 linii cu lățime de 64 octeți. Adresele cu care lucrează memoria cache sunt pe 32 de\nbiți. Care este lungimea în biți a tag-ului?",rights:["12"],wrongs:["15","13","14","11"],feedback:"32 - log2(16384 * 64) = 12"},52:{question:"Un cache mapat direct este organizat intern pe 4096 linii cu lățime de 32 octeți. Adresele cu care lucrează memoria cache sunt pe 32 de\nbiți. Care este lungimea în biți a tag-ului?",rights:["15"],wrongs:["16","17","14","18"],feedback:"32 - log2(4096 * 32) = 15"},53:{question:"Un sistem cu cache L1 si L2 are un hit rate de 80% din L1 și de 90% din L2. Care este miss rate-ul global?",rights:["2%"],wrongs:["20%","0.02%","98%","9.8%"],feedback:"1 - 0.8 - 0.2 * 0.9 = 0.02"},54:{question:"Un sistem cu cache L1 si L2 are un hit rate de 90% din L1 și de 95% din L2. Care este miss rate-ul global?",rights:["0.5%"],wrongs:["95%","9.5%","5%","0.05%"],feedback:"1 - 0.9 - 0.1 * 0.95 = 0.005"},55:{question:"Un sistem cu cache L1 si L2 are un hit rate de 95% din L1 și de 98% din L2. Care este miss rate-ul global?",rights:["0.1%"],wrongs:["0.99%","0.01%","1%","99%"],feedback:"1 - 0.95 - 0.05 * 0.98 = 0.001"},56:{question:"Un sistem cu cache L1 si L2 are un hit rate de 98% din L1 și de 99% din L2. Care este miss rate-ul global?",rights:["0.02%"],wrongs:["9.8%","98%","2%","20%"],feedback:"1 - 0.98 - 0.02 * 0.99 = 0.0002"},57:{question:"Un sistem de calcul are două niveluri de cache cu următoarele specificații:\nLatența de acces la L1 este de 2ns iar rata de hit locală este 93%\nLatența de acces din L1 în L2 este de 8ns iar rata de hit locală este de 94%\nLatența de acces din L2 în memoria RAM este de 300ns\nCare este timpul mediu de acces la memorie?",rights:["3.82ns"],wrongs:["0.382ns","38.2ns","382ns","3820ns"],feedback:"0.93 * 2ns + 0.07 * (0.94 * 10ns + 0.06 * 310ns) = 3.82ns"},58:{question:"Un sistem de calcul are două niveluri de cache cu următoarele specificații:\nLatența de acces la L1 este de 3ns iar rata de hit locală este 95%\nLatența de acces din L1 în L2 este de 9ns iar rata de hit locală este de 98%\nLatența de acces din L2 în memoria RAM este de 600ns\nCare este timpul mediu de acces la memorie?",rights:["4.05ns"],wrongs:["4050ns","0.405ns","40.5ns","405ns"],feedback:"0.95 * 3ns + 0.05 * (0.98 * 12ns + 0.02 * 612ns) = 4.05ns"},59:{question:"Un sistem de calcul are două niveluri de cache cu următoarele specificații:\nLatența de acces la L1 este de 4ns iar rata de hit locală este 90%\nLatența de acces din L1 în L2 este de 10ns iar rata de hit locală este de 95%\nLatența de acces din L2 în memoria RAM este de 500ns\nCare este timpul mediu de acces la memorie?",rights:["7.5ns"],wrongs:["0.75ns","0.075ns","750ns","75ns"],feedback:"0.9 * 4ns + 0.1 * (0.95 * 14ns + 0.05 * 514ns) = 7.5ns"},60:{question:"Un sistem de calcul are două niveluri de cache cu următoarele specificații:\nLatența de acces la L1 este de 5ns iar rata de hit locală este 80%\nLatența de acces din L1 în L2 este de 12ns iar rata de hit locală este de 90%\nLatența de acces din L2 în memoria RAM este de 400ns\nCare este timpul mediu de acces la memorie?",rights:["15.4ns"],wrongs:["0.154ns","1.54ns","154ns","1540ns"],feedback:"0.8 * 5ns + 0.2 * (0.9 * 17ns + 0.1 * 417ns) = 15.4ns"},61:{question:"Un sistem de calcul ce are doar un L1 cache de 128kB este <b>întotdeauna</b> mai rapid decât un sistem ce are L1 și L2 cache cu dimensiunea\ntotală de 128kB.",rights:["Fals"],wrongs:["Adevărat"],feedback:"<b>Nu</b> putem zice că un sistem cu un nivel de cache este <b>întotdeauna</b> mai rapid ca un sistem cu două niveluri de cache. Chiar dacă primul sistem are mai mult cache rapid (L1), există cazuri în care asta nu îl ajută să atingă o performanță mai mare ca al doilea sistem. Spre exemplu, un program poate să nu acceseze memoria deloc, caz în care cele două sisteme sunt la fel de rapide."},62:{question:"În toate sistemele multiprocesor, timpul de acces la memorie este identic pentru fiecare procesor.",rights:["Fals"],wrongs:["Adevărat"],feedback:"În cazul sistemelor NUMA (Non-Uniform Memory Access) timpul de acces la memorie diferă de la un procesor la altul."},63:{question:"Știind că valoarea din Stack Pointer este 0xb2, ce valoarea se va afla în el după ce se execută o instrucțiune RET?",rights:["0xb4"],wrongs:["0xb1","0xb3","0xb0"],feedback:""},64:{question:"Știind că în R20 se afla valoarea 58, iar în R21 se afla valoarea 197, ce valoare va avea flagul Z după ce se executa un AND între cele doua\nregistre?",rights:["1"],wrongs:["0"],feedback:""},65:{question:"Știm că la adresa 69 dintr-o memorie SSRAM se afla valoarea 47. Se considera următoarele valori pentru porturile acestei memorii:\nCS = 1\nWE = 1\nOE = 0\nADDR = 69\nDATA = 12 (intrare/ieșire).\nCe se va afla la adresa 69 după acest ciclu?",rights:["12, fiindcă se face o operație de scriere."],wrongs:["47, fiindcă se face o operație de citire, nu de scriere.","47, fiindcă nu este selectat chipul de memorie"],feedback:""}};

            for (let i = 0; i < questionsNumber; i += chunkSize) {
                let intervalButton = document.createElement("button");
                intervalButton.classList.add("btn", "btn-light","col-4","mr-1", "filterButton");
                intervalButton.setAttribute("start", i);
                intervalButton.setAttribute("end", i + chunkSize < questionsNumber ? i + chunkSize : questionsNumber);

                intervalButton.textContent = (i + 1).toString() + "-" + (i + chunkSize < questionsNumber ? i + chunkSize : questionsNumber).toString()
                rowDiv.appendChild(intervalButton);
            }
            document.body.appendChild(rowDiv);
        }
        insertFilterButtons(Math.ceil(Object.keys(RIGHTS).length / 6));


        /* Returns an array of strings */
        function getShuffledQuestionKeys(idxStart, idxEnd) {
            let questionsKeys = Object.keys(RIGHTS);
            if (idxStart !== undefined && idxEnd != undefined)
                questionsKeys = questionsKeys.slice(idxStart, idxEnd);
            return questionsKeys.sort((a, b) => 0.5 - Math.random());
        }

        /* Returns an array of strings */
        function getShuffledOptions(options) {
            return options
                .map(value => ({ value, sort: Math.random() }))
                .sort((a, b) => a.sort - b.sort)
                .map(({ value }) => value)
        }

        function insertQuestions(idxStart, idxEnd){
            let quizzesMain = document.createElement('main')
            let questionNumber = 0;
            getShuffledQuestionKeys(idxStart, idxEnd).forEach(questionID => {
                RIGHTS[questionID].rightids = [];
                RIGHTS[questionID].wrongids = [];

                let quizDiv = document.createElement('div')
                quizDiv.classList.add('quizDiv', "d-grid", "gap-1");
                quizDiv.setAttribute('data-id', questionID);

                let questionParagraph = document.createElement('p');
                questionParagraph.classList.add("question");
                questionParagraph.innerHTML = `${++questionNumber}. ${RIGHTS[questionID].question.replace(/(?:\r\n|\r|\n)/g, '<br>')}`;
                quizDiv.appendChild(questionParagraph);

                let optionID = 0;
                let allOptions = RIGHTS[questionID].rights;
                allOptions = allOptions.concat(RIGHTS[questionID].wrongs)
                getShuffledOptions(allOptions).forEach(optionText => {
                    optionButton = document.createElement('button');
                    optionButton.classList.add("optionButton", "btn", "btn-light");
                    optionButton.innerHTML = optionText;

                    if (RIGHTS[questionID].rights.includes(optionText))
                        RIGHTS[questionID].rightids.push(optionID.toString());
                    else if (RIGHTS[questionID].wrongs.includes(optionText))
                        RIGHTS[questionID].wrongids.push(optionID.toString());
                    optionButton.setAttribute('data-id', optionID++)
                    quizDiv.appendChild(optionButton);
                });

                quizzesMain.appendChild(quizDiv);
            });
            document.body.appendChild(quizzesMain);
        }
        insertQuestions();






        const onClick = (event) => {
        const element = event.target;
        const elementID = element.getAttribute('data-id');
        const elementParent = element.parentNode;
        const elementParentID = elementParent.getAttribute('data-id');
        const isFilterButton = element.classList.contains("filterButton");
        const isOptionButton = element.classList.contains("optionButton");
        const isQuestion = element.classList.contains('question');
        const isOptionButtonParentAnswered = elementParent.hasAttribute('question-already-answered');
        
        if (isQuestion) {
            elementParent.scrollIntoView({
                behavior: "smooth",
                block: "center",
                inline: "nearest"
            });
            navigator.clipboard.writeText(element.innerText.split(". ").slice(1).join(". "));
        }

        if (isFilterButton) {
            let main = document.querySelector('main'); 
            main.parentNode.removeChild(main);
            insertQuestions(parseInt(element.getAttribute('start')), parseInt(element.getAttribute('end')));
            return;
        } 
        if (isOptionButton) {
            if (isOptionButtonParentAnswered) return;

            element.setAttribute('chosen', "");
            const selectedOptionButtons = elementParent.querySelectorAll("button[chosen]").length;
            const numberOfRightAnswers = RIGHTS[elementParentID].rightids.length;
            if (selectedOptionButtons === numberOfRightAnswers) {
            elementParent.setAttribute('question-already-answered', "");
            elementParent.scrollIntoView({
                behavior: "smooth",
                block: "start",
                inline: "nearest"
            });

            let rightsGiven = 0;
            elementParent.querySelectorAll("button").forEach(option => {
                option.classList.add("pointerNone");
                const isRight = RIGHTS[elementParentID].rightids.includes(option.getAttribute('data-id'));

                if (option.hasAttribute('chosen')) {
                    option.classList.remove("btn-light");
                    if (isRight) {
                        rightsGiven++;
                        option.classList.add("btn-success");
                    } else {
                        option.classList.add("btn-danger");
                    }
                } else if (isRight) {
                    option.classList.remove("btn-light");
                    option.classList.add("btn-success", "makeOpaque");
                }
                  else
                    option.classList.add("btn-white");
            });

            let percentageRight = (100 * rightsGiven) / numberOfRightAnswers;
            let percentageWrong = 100 - percentageRight;
            const progressBar = `
                <section class="progress" style="height: 80%; margin-top: 3px; opacity: 0.9">
                <section class="progress-bar" style="width: 1%; background: white"></section>
                <section class="progress-bar-striped bg-success" style="width: ${percentageRight * 0.99}%; text-align: center; color: white">${rightsGiven}</section>
                <section class="progress-bar-striped bg-danger" style="width: ${percentageWrong * 0.99}%; text-align: center; color: white">${numberOfRightAnswers - rightsGiven}</section>
                <section class="progress-bar" style="width: 1%; background: white"></section>
                </section>`;

            elementParent.innerHTML += progressBar;
            if (RIGHTS[elementParentID].feedback != "")
                elementParent.innerHTML += `<p class="explanation">${RIGHTS[elementParentID].feedback}</p>`
            }
        }
        }
        window.addEventListener('click', onClick);
    }

    

    </script>
